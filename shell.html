<script>
// ─── createMobileApp 팩토리 ─────────────────────────────────────────────────
function createMobileApp(rootEl, flow) {
  const state = { stack: [flow.initial], data: {} };
  const app = {
    push(k)    { state.stack.push(k); render(); },
    replace(k) { state.stack[state.stack.length-1] = k; render(); },
    pop()      { if(state.stack.length>1){ state.stack.pop(); render(); } },
    reset()    { state.stack = [flow.initial]; state.data={}; render(); },
    goto(k)    { state.stack=[k]; render(); },
    set(k,v)   { state.data[k]=v; },
    get(k)     { return state.data[k]; },
    toast(msg) {
      const t = document.createElement('div');
      t.style.cssText = 'position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:24px;font:500 13px/1 Pretendard;white-space:nowrap;z-index:999;pointer-events:none;';
      t.textContent = msg;
      rootEl.appendChild(t);
      setTimeout(()=>t.remove(), 2200);
    },
  };
  function render() {
    const key = state.stack[state.stack.length-1];
    const screenFn = flow.screens[key] || flow.screens[flow.initial];
    rootEl.innerHTML = screenFn(app);
    window.__refreshIcons?.();
    rootEl.onclick = (e) => {
      const el = e.target.closest('[data-push],[data-pop],[data-toast],[data-reset],[data-goto]');
      if(!el) return;
      if(el.dataset.goto)  { app.goto(el.dataset.goto); return; }
      if(el.dataset.push)  { app.push(el.dataset.push); return; }
      if('pop' in el.dataset) { app.pop(); return; }
      if('reset' in el.dataset) { app.reset(); return; }
      if(el.dataset.toast) { app.toast(el.dataset.toast); return; }
    };
    flow.onMount?.[key]?.(rootEl, app);
  }
  render(); return app;
}

// ─── 공통 유틸 ────────────────────────────────────────────────────────────────
function bottomTab(app, active) {
  const tabs = [
    { key:'home',         icon:'home',           label:'홈'   },
    { key:'epro-home',    icon:'clipboard-list', label:'설문' },
    { key:'content-home', icon:'book-open',      label:'정보' },
    { key:'care-home',    icon:'heart-handshake',label:'돌봄' },
    { key:'my-page',      icon:'user',           label:'내정보'},
  ];
  return `<div class="wf-bottom-tab">
    ${tabs.map(t=>`
      <div class="wf-tab-item ${active===t.key?'active':''}" data-goto="${t.key}">
        <i data-lucide="${t.icon}"></i>
        <span>${t.label}</span>
      </div>`).join('')}
  </div>`;
}

function imgPh(w, h, label='') {
  return `<div class="wf-img-ph" style="width:${w};height:${h}px;border-radius:8px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <i data-lucide="image" style="width:24px;height:24px;color:#aaa;"></i>
      ${label?`<span style="font:400 11px/1 Pretendard;color:#aaa;">${label}</span>`:''}
    </div>
  </div>`;
}

function progressBar(pct) {
  return `<div class="wf-progress-bar"><div class="wf-progress-fill" style="width:${pct}%"></div></div>`;
}

function graphPh(w, h, label='그래프') {
  return `<div class="wf-img-ph" style="width:${w};height:${h}px;border-radius:8px;flex-direction:column;gap:6px;">
    <i data-lucide="bar-chart-2" style="width:24px;height:24px;color:#aaa;"></i>
    <span style="font:400 11px/1 Pretendard;color:#aaa;">${label}</span>
  </div>`;
}

// ─── 공통 화면 생성자 (11개) ──────────────────────────────────────────────────

    // 1. splash — 로그인

          </div>
          <div style="display:flex;flex-direction:column;gap:16px;margin-bottom:32px;">
            <div>
              <div style="font:600 13px/1 Pretendard;color:#555;margin-bottom:8px;">연구 참여 번호</div>
              <input class="wf-input" type="text" placeholder="예: OND-2024-0001" readonly>
            </div>
            <div>
              <div style="font:600 13px/1 Pretendard;color:#555;margin-bottom:8px;">생년월일</div>
              <input class="wf-input" type="text" placeholder="예: 19650315 (8자리)" readonly>
            </div>
          </div>
          <button class="wf-btn-primary" data-push="consent">로그인</button>
          <div style="text-align:center;margin-top:20px;">
            <span style="font:400 12px/1 Pretendard;color:#aaa;">연구 참여번호는 담당 의료진에게 문의하세요</span>
          </div>
        </div>
      </div>`,

    // 2. consent — 전자동의서
    'consent': (app) => `
      <div class="screen-scroll" style="background:#fff;">
        <div class="wf-appbar" style="background:#fff;">
          <div style="font:700 17px/1.2 Pretendard;color:#1a1a1a;">전자 동의서 (eIC)</div>
        </div>
        <div style="padding:20px 20px 120px;">
          <div style="background:#f4f4f4;border:1px solid #d8d8d8;border-radius:10px;padding:14px 16px;margin-bottom:20px;">
            <div style="font:600 12px/1.4 Pretendard;color:#aaa;margin-bottom:4px;">연구 제목</div>
            <div style="font:700 14px/1.5 Pretendard;color:#1a1a1a;">수술 후 회복 지원을 위한 디지털 기반 환자 경험 연구</div>
          </div>
          <div style="font:600 13px/1 Pretendard;color:#1a1a1a;margin-bottom:10px;">연구 참여 안내</div>
          <div style="background:#f4f4f4;border:1px solid #ebebeb;border-radius:10px;padding:16px;margin-bottom:20px;height:220px;overflow-y:auto;">
            <div style="font:400 13px/1.8 Pretendard;color:#555;">
              본 연구는 수술 후 회복 과정에서의 환자 경험을 파악하기 위한 관찰 연구입니다.<br><br>
              참여자는 정기적으로 설문에 응답하게 되며, 수집된 데이터는 익명화되어 연구 목적으로만 사용됩니다.<br><br>
              연구 참여는 자발적이며 언제든지 철회할 수 있습니다. 참여 철회가 의료 서비스에 영향을 주지 않습니다.<br><br>
              수집 항목: 증상 보고, 기능 상태, 삶의 질 관련 설문 데이터<br><br>
              보관 기간: 연구 종료 후 5년
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:28px;">
            ${['위 연구의 목적과 절차를 이해하였습니다','개인정보 수집 및 활용에 동의합니다','연구 참여 도중 언제든 철회할 수 있음을 이해합니다'].map((t,i)=>`
              <label style="display:flex;align-items:flex-start;gap:12px;cursor:pointer;">
                <div style="width:22px;height:22px;border:2px solid #1a1a1a;border-radius:5px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:#1a1a1a;">
                  <i data-lucide="check" style="width:14px;height:14px;color:#fff;"></i>
                </div>
                <span style="font:400 14px/1.5 Pretendard;color:#1a1a1a;">${t}</span>
              </label>`).join('')}
          </div>
          <button class="wf-btn-primary" data-goto="home">동의하고 시작하기</button>
        </div>
      </div>`,

    // 3. survey-intro
    'survey-intro': (app) => `
      <div class="screen-scroll" style="background:#f4f4f4;">

                <div style="width:56px;height:56px;border-radius:50%;background:#e0e0e0;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                  <i data-lucide="user" style="width:28px;height:28px;color:#aaa;"></i>
                </div>
                <div>
                  <div style="font:700 16px/1.2 Pretendard;color:#1a1a1a;">${n}</div>
                  <div style="font:400 13px/1.4 Pretendard;color:#555;">${spec}</div>
                  <span style="font:500 11px/1 Pretendard;color:#555;background:#ebebeb;padding:3px 8px;border-radius:10px;display:inline-block;margin-top:6px;">${avail}</span>
                </div>
              </div>
              <button class="wf-btn-primary" style="height:56px;font-size:15px;border-radius:12px;" data-push="care-profile">프로필 보기 · 연락하기</button>
            </div>`).join('')}
        </div>
        ${tab('care-home')}
      </div>`,
  };

  return { ...shared, ...unique };
}

// ─── 앱 인스턴스 관리 ─────────────────────────────────────────────────────────
const apps = {};

function initApp(id, screensFn) {
  const rootEl = document.getElementById('screen-' + id);
  if (!rootEl) return;
  apps[id] = createMobileApp(rootEl, {
    initial: 'splash',
    screens: screensFn(),
  });
}

function resetAll() {
  ['a','b','c'].forEach(id => {
    const app = apps[id];
    if (app) app.reset();
  });
}

// ─── 초기화 ────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  initApp('a', makeFlowA);
  initApp('b', makeFlowB);
  initApp('c', makeFlowC);
});

// ════════════════════════════════════════════════════════════════════════════
// FLOW VIEW — 플로우맵 캔버스
// ════════════════════════════════════════════════════════════════════════════

// 스크린 위치 (raw, offset 전) — 가로 플로우 레이아웃
const FL_POS = {
  'splash':         {x:    0, y:    0},
  'consent':        {x:  510, y:    0},
  'home':           {x: 1020, y:    0},
  'epro-home':      {x: 1530, y: -960},
  'survey-intro':   {x: 2040, y: -960},
  'survey-q':       {x: 2550, y: -960},
  'survey-result':  {x: 3060, y: -960},
  'survey-history': {x: 3060, y:-1920},
  'content-home':   {x: 1530, y:    0},
  'content-detail': {x: 2040, y:    0},
  'care-home':      {x: 1530, y:  960},
  'care-profile':   {x: 2040, y:  960},
  'care-chat':      {x: 2550, y:  960},
  'my-page':        {x: 1530, y: 1920},
  'notifications':  {x: 2040, y: 1920},
};
const FL_LABEL = {
  'splash':'로그인', 'consent':'전자동의서 (eIC)', 'home':'홈',
  'epro-home':'설문 목록', 'survey-intro':'설문 안내', 'survey-q':'설문 응답',
  'survey-result':'설문 결과', 'survey-history':'응답 이력',
  'content-home':'정보 목록', 'content-detail':'정보 상세',
  'care-home':'돌봄 목록', 'care-profile':'제공자 프로필',
  'care-chat':'채팅', 'my-page':'내 정보', 'notifications':'알림',
};
const FL_ARROWS = [
  ['splash','consent'], ['consent','home'],
  ['home','epro-home'], ['home','content-home'], ['home','care-home'], ['home','my-page'],
  ['home','notifications'],
  ['epro-home','survey-intro'], ['epro-home','survey-history'],
  ['survey-intro','survey-q'], ['survey-q','survey-result'],
  ['survey-result','home'], ['survey-result','survey-history'],
  ['content-home','content-detail'],
  ['care-home','care-profile'], ['care-profile','care-chat'],
  ['my-page','notifications'],
];

// 좌표 오프셋 (음수 제거)
const FL_OX = 100, FL_OY = 2060;
const SW = 390, SH = 844;
const INIT_SCALE = 0.42;

function flAbsPos(id) {
  const p = FL_POS[id];
  return p ? { x: p.x + FL_OX, y: p.y + FL_OY } : null;
}

// 상태
let flT = { x:0, y:0, scale:INIT_SCALE };
let flFlowId = null;
let flActive = 'splash';
let flHistory = [];
let flSpace = false, flPan = false, flMouse = null;
let flPinchD = 0;

function openFlowView(flowId) {
  flFlowId = flowId;
  flActive = 'splash';
  flHistory = [];

  const titles = { a:'A안 · 클리닉 카드형', b:'B안 · 타임라인형', c:'C안 · 대형 버튼형' };
  document.getElementById('fl-title').textContent = titles[flowId] + '  —  플로우 맵';

  // 스크린 렌더용 mock app
  const mock = { get:()=>null, set:()=>{}, push:()=>{}, pop:()=>{}, replace:()=>{}, goto:()=>{}, toast:()=>{}, reset:()=>{} };
  const screensFn = flowId==='a' ? makeFlowA : flowId==='b' ? makeFlowB : makeFlowC;
  const screens = screensFn();

  // SVG 화살표 생성
  const cW = 3550 + FL_OX*2, cH = 1920 + SH + FL_OY + 200;
  let svg = `<svg style="position:absolute;top:0;left:0;width:${cW}px;height:${cH}px;overflow:visible;pointer-events:none;">
    <defs><marker id="flarr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="rgba(255,255,255,0.75)"/>
    </marker></defs>`;
  function getArrowPorts(fp, tp) {
    const fcx = fp.x + SW/2, fcy = fp.y + SH/2;
    const tcx = tp.x + SW/2, tcy = tp.y + SH/2;
    const dx = tcx - fcx, dy = tcy - fcy;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (adx > ady * 1.2) {
      if (dx > 0) return { fx: fp.x+SW+8, fy: fcy, tx: tp.x-8,    ty: tcy, horiz: true };
      else         return { fx: fp.x-8,    fy: fcy, tx: tp.x+SW+8, ty: tcy, horiz: true };
    } else {
      if (dy > 0) return { fx: fcx, fy: fp.y+SH+18, tx: tcx, ty: tp.y-18,    horiz: false };
      else         return { fx: fcx, fy: fp.y-18,    tx: tcx, ty: tp.y+SH+18, horiz: false };
    }
  }
  for (const [from, to, label] of FL_ARROWS) {
    const fp = flAbsPos(from), tp = flAbsPos(to);
    if (!fp || !tp) continue;
    const {fx, fy, tx, ty, horiz} = getArrowPorts(fp, tp);
    const hw = Math.abs(tx - fx) / 2;
    const path = horiz
      ? `M${fx},${fy} C${fx+hw},${fy} ${tx-hw},${ty} ${tx},${ty}`
      : `M${fx},${fy} C${fx},${(fy+ty)/2} ${tx},${(fy+ty)/2} ${tx},${ty}`;
    svg += `<path d="${path}" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2" marker-end="url(#flarr)"/>`;
    if (label) {
      svg += `<text x="${(fx+tx)/2}" y="${(fy+ty)/2-8}" text-anchor="middle"
        font-size="11" fill="rgba(255,255,255,0.55)" font-family="Pretendard,sans-serif">${label}</text>`;
    }
  }
  svg += `</svg>`;

  // 스크린 프레임들
  let frames = '';
  for (const [sid, raw] of Object.entries(FL_POS)) {
    const p = flAbsPos(sid);
    const html = screens[sid] ? screens[sid](mock) : '';
    frames += `<div class="fl-frame ${sid===flActive?'fl-active':''}" data-sid="${sid}"
      style="left:${p.x}px;top:${p.y}px;width:${SW}px;">
      <div class="fl-label">${FL_LABEL[sid]||sid}</div>
      <div class="fl-device">${html}</div>
    </div>`;
  }

  const canvas = document.getElementById('fl-canvas');
  canvas.style.width  = cW + 'px';
  canvas.style.height = cH + 'px';
  canvas.innerHTML = svg + frames;
  window.__refreshIcons?.();

  // 단일 클릭 핸들러 — data-pop, data-push, data-goto, 프레임 클릭 통합
  canvas.onclick = (e) => {
    const popEl = e.target.closest('[data-pop]');
    if (popEl) { flBack(); return; }
    const pushEl = e.target.closest('[data-push]');
    const gotoEl = e.target.closest('[data-goto]');
    const frame  = e.target.closest('.fl-frame');
    const dest = (pushEl && FL_POS[pushEl.dataset.push]) ? pushEl.dataset.push
               : (gotoEl && FL_POS[gotoEl.dataset.goto]) ? gotoEl.dataset.goto
               : (frame  && FL_POS[frame.dataset.sid])   ? frame.dataset.sid
               : null;
    if (dest) flGoTo(dest);
  };

  document.getElementById('flow-overlay').style.display = 'block';
  flT = { x:0, y:0, scale:INIT_SCALE };
  flApply();
  setTimeout(() => flCenterOn('splash', false), 60);
}

function closeFlowView() {
  document.getElementById('flow-overlay').style.display = 'none';
}

function flBack() {
  if (flHistory.length > 0) flGoTo(flHistory.pop(), false);
}

function flGoTo(sid, pushHistory = true) {
  if (!FL_POS[sid]) return;
  if (pushHistory && flActive && flActive !== sid) flHistory.push(flActive);
  flActive = sid;
  document.querySelectorAll('.fl-frame').forEach(f => {
    const isTarget = f.dataset.sid === sid;
    f.classList.toggle('fl-active', isTarget);
    if (isTarget) {
      f.classList.remove('fl-nav');
      void f.offsetWidth; // reflow for animation restart
      f.classList.add('fl-nav');
      setTimeout(() => f.classList.remove('fl-nav'), 750);
    }
  });
  flCenterOn(sid, true);
}

function flCenterOn(sid, animated) {
  const p = flAbsPos(sid);
  if (!p) return;
  const wrap = document.getElementById('fl-wrap');
  const vw = wrap.clientWidth, vh = wrap.clientHeight;
  const nx = vw/2 - (p.x + SW/2) * flT.scale;
  const ny = vh/2 - (p.y + SH/2) * flT.scale;
  const canvas = document.getElementById('fl-canvas');
  if (animated) {
    canvas.style.transition = 'transform .48s cubic-bezier(.4,0,.2,1)';
    setTimeout(() => canvas.style.transition = '', 520);
  }
  flT.x = nx; flT.y = ny;
  flApply();
}

function flApply() {
  const canvas = document.getElementById('fl-canvas');
  if (!canvas) return;
  canvas.style.transform = `translate(${flT.x}px,${flT.y}px) scale(${flT.scale})`;
  document.getElementById('fl-zoom-pct').textContent = Math.round(flT.scale*100) + '%';
}

function flZoomAt(cx, cy, factor) {
  const ns = Math.max(0.12, Math.min(2.5, flT.scale * factor));
  const r = ns / flT.scale;
  flT.x = cx - r*(cx - flT.x);
  flT.y = cy - r*(cy - flT.y);
  flT.scale = ns;
  flApply();
}

function flZoom(factor) {
  const w = document.getElementById('fl-wrap');
  if (w) flZoomAt(w.clientWidth/2, w.clientHeight/2, factor);
}

function flFit() {
  const wrap = document.getElementById('fl-wrap');
  if (!wrap) return;
  const xs = Object.values(FL_POS).map(p => p.x + FL_OX);
  const ys = Object.values(FL_POS).map(p => p.y + FL_OY);
  const minX = Math.min(...xs), maxX = Math.max(...xs) + SW;
  const minY = Math.min(...ys), maxY = Math.max(...ys) + SH;
  const vw = wrap.clientWidth - 80, vh = wrap.clientHeight - 80;
  const scale = Math.min(2.5, Math.min(vw/(maxX-minX), vh/(maxY-minY)));
  flT.scale = scale;
  flT.x = (wrap.clientWidth  - (maxX-minX)*scale)/2 - minX*scale;
  flT.y = (wrap.clientHeight - (maxY-minY)*scale)/2 - minY*scale;
  flApply();
}

// ── 키보드 ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (document.getElementById('flow-overlay')?.style.display === 'none') return;
  if (e.code === 'Space' && !e.target.matches('input,textarea')) {
    e.preventDefault(); flSpace = true;
    const w = document.getElementById('fl-wrap');
    if (w) w.style.cursor = 'grab';
  }
  if (e.ctrlKey && (e.key==='=' || e.key==='+')) { e.preventDefault(); flZoom(1.25); }
  if (e.ctrlKey && e.key==='-') { e.preventDefault(); flZoom(0.8); }
  if (e.key==='0' && e.ctrlKey) { e.preventDefault(); flFit(); }
  if (e.key==='Escape') closeFlowView();
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    flSpace = false;
    const w = document.getElementById('fl-wrap');
    if (w && !flPan) w.style.cursor = 'default';
  }
});

// ── 마우스 팬 ──────────────────────────────────────────────────────────────
document.addEventListener('mousedown', e => {
  const w = document.getElementById('fl-wrap');
  if (!w?.contains(e.target)) return;
  if (flSpace || e.button === 1) {
    e.preventDefault(); flPan = true;
    flMouse = { x:e.clientX, y:e.clientY };
    w.style.cursor = 'grabbing';
  }
});
document.addEventListener('mousemove', e => {
  if (!flPan || !flMouse) return;
  flT.x += e.clientX - flMouse.x;
  flT.y += e.clientY - flMouse.y;
  flMouse = { x:e.clientX, y:e.clientY };
  flApply();
});
document.addEventListener('mouseup', () => {
  if (flPan) {
    flPan = false;
    const w = document.getElementById('fl-wrap');
    if (w) w.style.cursor = flSpace ? 'grab' : 'default';
  }
});

// ── 휠 줌·스크롤 ───────────────────────────────────────────────────────────
document.addEventListener('wheel', e => {
  const w = document.getElementById('fl-wrap');
  if (!w?.contains(e.target)) return;
  if (e.ctrlKey) {
    e.preventDefault();
    const r = w.getBoundingClientRect();
    flZoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY > 0 ? 0.9 : 1.1);
  } else {
    e.preventDefault();
    flT.x -= e.deltaX * 1.2;
    flT.y -= e.deltaY * 1.2;
    flApply();
  }
}, { passive:false });

// ── 터치 핀치 줌 ────────────────────────────────────────────────────────────
document.addEventListener('touchstart', e => {
  if (!document.getElementById('fl-wrap')?.contains(e.target)) return;
  if (e.touches.length === 2)
    flPinchD = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
}, { passive:false });
document.addEventListener('touchmove', e => {
  const w = document.getElementById('fl-wrap');
  if (!w?.contains(e.target) || e.touches.length !== 2) return;
  e.preventDefault();
  const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  const cx = (e.touches[0].clientX + e.touches[1].clientX)/2;
  const cy = (e.touches[0].clientY + e.touches[1].clientY)/2;
  const r = w.getBoundingClientRect();
  if (flPinchD > 0) flZoomAt(cx-r.left, cy-r.top, d/flPinchD);
  flPinchD = d;
}, { passive:false });
</script>
