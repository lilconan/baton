# hanlint 설정. 규칙을 끄려면 disable 에 이름을 넣는다. 규칙의 기술서는 hanlint explain <규칙>.

# 글의 종류. 그 종류에 안 맞는 규칙을 처음부터 끈다. disable 은 그 위에 더한다.
#   blog: 전부 켠다
#   report: noQuestion, firstResultDistance, introImage, moreLater, numberOrphan
#   docs: noQuestion, firstResultDistance, introImage, moreLater, draftHistory, blockUnread, numberOrphan, duplicateBlock, headingUniform
#   guide: duplicateBlock, headingUniform
#   essay: noQuestion, firstResultDistance, introImage, moreLater, numberOrphan, factListParagraph
#   fiction: noQuestion, firstResultDistance, introImage, moreLater, numberOrphan, factListParagraph
#   encyclopedia: noQuestion, firstResultDistance, introImage, moreLater, draftHistory, blockUnread, numberOrphan, duplicateBlock, headingUniform, introLong
#   chat: countMismatch, duplicateBlock, factListParagraph, firstResultDistance, headingSentence, headingSkip, headingUniform, inputFileSource, installImport, introLong, keywordMissing, noQuestion, outsideProfile, paraFragment, platformApi, promiseRecall, sectionNoProse
preset = "docs"

# 규칙 목록과 한 줄 설명
#  문장 안에서 세는 것
#   cliche: 핵심은, 결국 중요한 것은, 단순히 A 를 넘어, 살펴보겠습니다 같은 상투어.
#   connectorRepeat: 같은 접속부사로 시작하는 문장이 한 문단 안에 연달아 오는 자리.
#   danglingDeixis: 지시어가 있는데 바로 앞 문장과 화제어가 하나도 겹치지 않는 자리.
#   dash: em 대시 (U+2014) 와 en 대시 (U+2013). 코드 블록까지 글 전체를 본다.
#   deixis: 이것, 해당 값, 위의 코드, 이러한 같은 지시어. 앞 문장에 가리킬 것이 있는 경우.
#   doubleNegative: 하지 않으면 안 된다, 하지 않을 수 없다 같은 이중 부정.
#   doublePassive: 되어지다, 보여지다, 잊혀지다 처럼 피동에 어지다 를 또 붙인 이중 피동.
#   draftHistory: 글쓴이의 수정 이력과 자기 검증 기록. 처음에는 ~라고 썼습니다, ~것을 확인했습니다.
#   endingRepeat: 같은 종결어미가 endingRun 개 이어지는데 그 사이에 인과도 질문도 독자를 부르는 말도 없는 자리.
#   euiChain: 한 문장에 관형격 조사 의 가 셋 이상이거나, 의 로 끝나는 어절 둘이 붙어 있다 (회사의 팀의 결정).
#   fillerOpener: 다음으로, 이어서, 마지막에는 으로만 잇는 문장.
#   hardWord: 금일, 익월, 상기, 소정의, 노하우, 인프라, 피드백 처럼 쉬운 말이 있는 어려운 한자어와 외래어.
#   imperativePeriod: 명령형과 청유형 뒤의 마침표.
#   japaneseLoan: 구좌, 익일, 잔고, 고참, 망년회 같은 일본어투 낱말.
#   longSentence: 어절 수가 longSentenceMax 를 넘는 문장.
#   negationRedefine: 단순한 X 가 아닙니다 뒤에 Y 입니다 로 다시 정의하는 두 문장 공식.
#   nounPile: 명사가 조사 없이 nounPileMin 개 이상 이어진 자리.
#   numberOrphan: A 에서 B 로 라고 견주는데 A 가 글 앞에 한 번도 나온 적 없는 자리.
#   outsideProfile: 같은 종류의 글에서 백 문장에 하나도 안 되는 값 (문장 길이, 쉼표, 처음 나온 화제어, 헤지) 을 가진 문장.
#   redundantPair: 역전 앞, 그때 당시, 매 시간마다 같은 겹말.
#   translationese: ~에 있어서, ~에 의해, ~을 통해, ~로부터, ~에도 불구하고 같은 번역투.
#  문단 사이에서 세는 것
#   factListParagraph: 짧은 평서문 셋 이상이 잇는 말 없이 이어지는 문단.
#   paraFragment: 한두 문장짜리 산문 문단이 fragmentRun 개 이상 연달아 오는 자리.
#  글의 짜임에서 세는 것
#   blockUnread: 코드 블록 바로 뒤에 붙인 출력을 읽어 주는 설명글이 없는 자리.
#   bridgeRepeat: 절을 닫는 문장이 이음 표지 (이번에는, 이제, 다음으로) 로 시작하는 절이 bridgeRepeatMin 개 이상인 글.
#   emojiBullet: 이모지로 시작하는 목록 항목.
#   headingSentence: 본문 문장을 그대로 복사한 절 제목.
#   headingSkip: 제목 수준을 건너뛴 자리. H2 다음에 H4 가 오거나 글이 H3 으로 시작하는 것.
#   headingUniform: H2 셋 이상 가운데 headingUniformRatio 넘게 같은 글자로 끝나는 목차.
#   introImage: 도입에 그림이 introMaxImages 보다 많은 글.
#   introLong: 첫 H2 앞의 산문 문단이 introMaxParagraphs 를 넘는 도입.
#   loneSubheading: H2 아래 소제목이 하나뿐이고 그 제목이 절 제목의 말을 되풀이하는 자리.
#   moreLater: 마지막 절의 목록 항목이 moreLaterMaxChars 를 넘어 본문만큼 설명하는 것.
#   sectionNoProse: 설명글 없이 코드, 표, 이미지만 있는 절.
#  두 자리를 대조해 세는 것
#   countMismatch: 같은 단위로 서로 다른 수를 약속하는 글. 여섯 가지를 소개한다고 열고 다섯 가지라고 닫는 것.
#   enoughOnce: 여기까지면 충분합니다 로 끊는 문장이 한 글에 두 번 이상 나오는 것.
#   fieldEcho: frontmatter 가 약속한 것을 도입이나 마지막 절이 하나도 부르지 않는 글.
#   keywordHeading: 제목이 약속한 대표 검색어의 말이 절 제목 어디에도 없는 글.
#   keywordMissing: 대표 검색어가 제목에도 첫 문단에도 없는 글.
#   noQuestion: 절이 둘 이상인데 물음표가 한 번도 없는 글.
#   promiseRecall: 뒤에서 다루겠습니다 라고 미뤄 놓고 앞에서 미룬 것을 부르는 표지가 글 어디에도 없는 것.
#   tableOddCell: 한 열이 전부 같은 단위로 잰 값인데 한 칸만 다른 것을 담은 표.
#  표기와 띄어쓰기
#   confusable: 학생으로써, 정답을 맞추다, 나와 틀리다, 감기가 낳다 처럼 뜻이 다른 말을 바꿔 쓴 자리.
#   spacing: 할수 있다, 것같다, 떠난지 3년, 한번도, 두번, 수 밖에, 뿐만아니라 처럼 자주 틀리는 띄어쓰기.
#   spelling: 됬, 돼고, 않 해, 왠일, 몇일, 금새, 오랫만, 어떻해, 할께, 바램 처럼 자주 틀리는 표기.
#  코드 블록 사이를 대조하는 것
#   duplicateBlock: 앞선 코드나 출력 블록과 거의 같은 블록.
#   firstResultDistance: 첫 코드나 표나 그림이 나오기 전의 산문 문단이 firstResultMaxParagraphs 를 넘는 글.
#   inputFileSource: 코드가 읽는 파일과 쓰는 폴더가 글 어디에서도 만들어지지 않은 자리.
#   installImport: 설치 줄에 없는 패키지를 import 하는 코드. 그리고 코드 한 줄이 조용히 요구하는 숨은 의존성.
#   platformApi: 한 운영체제에서만 도는 API 나 경로를 쓴 코드.

disable = []

# 대표 검색어를 읽을 frontmatter 필드. 없으면 keywordMissing 은 돌지 않는다
# keywordField = "primaryKeyword"

# 도입과 마지막 절이 담아야 하는 frontmatter 필드. 비어 있으면 fieldEcho 는 돌지 않는다
# introFields = ["readerQuestion"]
# endingFields = ["readerTakeaway"]

# hanlint profile build 가 만든 파일. 있으면 종류의 프로파일 대신 그것과 견준다 (outsideProfile)
# profile = "profile.json"

# hanlint baseline 이 만든 잠금 파일. 있으면 그 안의 지적은 넘기고 새로 생긴 것만 막는다
baseline = ".hanlint-baseline.json"

# 코드도 산문도 아닌 펜스의 언어 표기. 장면 계약과 도표 원문은 코드 블록으로 세지 않고 지문에서 뺀다
# ignoreFences = ["course-scene", "mermaid"]

# 임계. 기본값의 정본은 hanlint 의 config/settings.py 다
# fragmentRun = 3
# introMaxParagraphs = 4
# headingUniformRatio = 0.75
# headingSentenceMaxLevel = 6
# bridgeRepeatMin = 3
# nounPileMin = 5
# endingRun = 4
# factListMinSentences = 3
# factListMaxMeanLength = 8.0
# flowValleyMinSentences = 2
# longSentenceMax = 30
# duplicateBlockRatio = 0.9
# firstResultMaxParagraphs = 4
# introMaxImages = 1
# moreLaterMaxChars = 150
# tableOddCellMinRows = 4

# 사전에 더할 항목. 키는 cliches, translationese, redundantPair, japaneseLoan
# [dictionary]
# cliches = ["우리의 여정"]
# translationese = [{ pattern = "에 대한 이해", fix = "를 아는 것" }]

# 표면 치환이 바꾸면 안 되는 한국어 고유명사와 프로젝트 용어. 수치와 라틴 식별자는 자동으로 보호한다
# protectedTerms = ["한린트", "김민지"]
# enforceStyle = ["noQuestion", "nounPile"]  # 선택한 문체 신호만 error로 강제한다

# 사람이 승인한 프로젝트 본보기. 같은 규칙과 프리셋의 내장 본보기를 덮어쓴다
# [[exemplars]]
# rule = "translationese"
# before = "설계에 대한 이해가 필요합니다."
# after = "설계를 알아야 합니다."
# moved = "명사구를 서술어로 풀어 씀"
# presets = ["blog"]

# 사람이 승인한 국소 고침. 원문을 포함한 모든 조건이 맞을 때만 그대로 재생한다
# [[patches]]
# rule = "translationese"
# before = "설계에 대한 이해가 필요합니다."
# after = "설계를 알아야 합니다."
# moved = "명사구를 서술어로 풀어 씀"
# sourceText = "설계에 대한 이해가 필요합니다."  # before의 마크다운까지 보존한 선택용 원문
# sentence = "설계에 대한 이해가 필요합니다."  # before에서 마크다운 표식을 걷은 선택용 원문
# cue = "에 대한"
# reader = "new"
# presets = ["blog"]

# 사람이 적용 범위까지 승인한 표면 치환. 단어 경계 한 자리와 보호 원자가 맞을 때만 결과를 낸다
# [[operations]]
# before = "여러가지"
# after = "여러 가지"
# presets = ["blog"]
