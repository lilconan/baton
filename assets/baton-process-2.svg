        <title id="baton-process-2-title">Baton 풀프로세스 — STEP 0 상세</title>
        <desc id="baton-process-2-desc">STEP 0 입력 게이트에서 문서 틀을 복사하고 입력을 나눈 뒤, 고정 조건 모순 확인과 문제 찾기·좁히기·해법 찾기를 거치며 확인 A·B·C에서 사용자 확인을 받고, 근거와 어긋나면 앞 단계로 되돌아가는 흐름을 보여 준다.</desc>
